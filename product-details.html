<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080808;
    color:#fff;
}


/* =========================
   HEADER
========================= */

header{
    background:rgba(8,8,8,.96);
    border-bottom:1px solid #292000;
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(10px);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#ffd700;
    letter-spacing:1px;
}

.logo span{
    color:#fff;
}

.back-btn{
    color:#ffd700;
    text-decoration:none;

    border:1px solid #ffd700;

    padding:9px 16px;
    border-radius:25px;

    font-size:14px;

    transition:.3s;
}

.back-btn:hover{
    background:#ffd700;
    color:#000;
}


/* =========================
   MAIN
========================= */

.details-wrapper{
    max-width:1200px;
    margin:40px auto;
    padding:20px;
}


/* =========================
   PRODUCT BOX
========================= */

.product-details{

    background:#111;

    border:1px solid #292000;

    border-radius:20px;

    padding:25px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:40px;

    box-shadow:0 15px 50px rgba(0,0,0,.35);
}


/* =========================
   IMAGE SECTION
========================= */

.image-section{
    width:100%;
}


/* IMAGE SLIDER */

.main-image-box{

    width:100%;

    height:500px;

    background:#fff;

    border-radius:15px;

    overflow:hidden;

    position:relative;

    touch-action:pan-y;

    user-select:none;
}


/* IMAGE TRACK */

.image-track{

    width:100%;
    height:100%;

    display:flex;

    transition:transform .35s ease;

    will-change:transform;
}


/* EACH IMAGE */

.slide{

    min-width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#fff;
}

.slide img{

    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;

    user-select:none;
}


/* =========================
   ARROW BUTTONS
========================= */

.slider-arrow{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,.55);

    color:#fff;

    font-size:25px;

    cursor:pointer;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:.25s;
}

.slider-arrow:hover{

    background:#ffd700;

    color:#000;

    transform:translateY(-50%) scale(1.08);
}

.prev-btn{
    left:15px;
}

.next-btn{
    right:15px;
}


/* =========================
   IMAGE COUNTER
========================= */

.image-counter{

    position:absolute;

    bottom:12px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.65);

    color:#fff;

    padding:6px 12px;

    border-radius:20px;

    font-size:13px;

    z-index:10;
}


/* =========================
   INFO
========================= */

.product-info{
    padding:10px;
}

.product-info h1{

    font-size:35px;

    line-height:1.25;

    margin-bottom:15px;
}

.price{

    color:#ffd700;

    font-size:30px;

    font-weight:bold;

    margin-bottom:25px;
}

.short-info{

    color:#aaa;

    line-height:1.8;

    margin-bottom:25px;

    font-size:15px;
}


/* =========================
   DETAILS
========================= */

.details-title{

    color:#ffd700;

    font-size:22px;

    margin-bottom:12px;
}

.details-list{

    list-style:none;

    margin-bottom:25px;
}

.details-list li{

    padding:9px 0;

    border-bottom:1px solid #222;

    color:#ccc;

    line-height:1.5;
}


/* =========================
   DESCRIPTION
========================= */

.description{

    color:#aaa;

    line-height:1.8;

    font-size:15px;

    margin-bottom:30px;
}


/* =========================
   ORDER BUTTON
========================= */

.order-btn{

    display:block;

    width:100%;

    text-align:center;

    background:#ffd700;

    color:#000;

    text-decoration:none;

    padding:16px;

    border-radius:10px;

    font-size:20px;

    font-weight:bold;

    transition:.3s;
}

.order-btn:hover{

    background:#fff;

    transform:translateY(-2px);

    box-shadow:0 10px 30px rgba(255,215,0,.15);
}


/* =========================
   PRODUCT NOT FOUND
========================= */

.not-found{

    max-width:700px;

    margin:80px auto;

    background:#111;

    border:1px solid #292000;

    border-radius:20px;

    padding:60px 20px;

    text-align:center;
}

.not-found h1{

    color:#ffd700;

    margin-bottom:20px;
}

.not-found p{

    color:#999;

    margin-bottom:25px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .product-details{

        grid-template-columns:1fr;

        gap:25px;

        padding:18px;
    }

    .main-image-box{

        height:400px;
    }

    .product-info h1{

        font-size:28px;
    }

    .price{

        font-size:25px;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:500px){

    .navbar{

    }

    .logo{

    }

    .back-btn{

        font-size:12px;

        padding:8px 12px;
    }

    .details-wrapper{

        margin:20px auto;

        padding:10px;
    }

    .product-details{

        border-radius:15px;

        gap:20px;
    }

    .main-image-box{

        height:320px;

        border-radius:12px;
    }

    .slider-arrow{

        width:40px;
        height:40px;

        font-size:21px;
    }

    .prev-btn{
        left:10px;
    }

    .next-btn{
        right:10px;
    }

    .product-info{

        padding:5px;
    }

    .product-info h1{

        font-size:25px;
    }

    .price{

        font-size:24px;
    }

    .order-btn{

        font-size:18px;

        padding:14px;
    }

}


/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-width:360px){

    .main-image-box{

        height:280px;
    }

    .slider-arrow{

        width:36px;
        height:36px;

        font-size:19px;
    }

}

</style>

/* ==================================================
   GET PRODUCT ID
================================================== */

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");

const product =
products[id];



/* ==================================================
   SLIDER VARIABLES
================================================== */

let currentImage = 0;

let startX = 0;

let endX = 0;



/* ==================================================
   SHOW PRODUCT
================================================== */

if(product){

    document.getElementById("productDetails").innerHTML = `

        <div class="product-details">


            <!-- IMAGE SECTION -->

            <div class="image-section">

                <div
                    class="main-image-box"
                    id="imageSlider"
                >

                    <div
                        class="image-track"
                        id="imageTrack"
                    >

                        ${product.images.map(image => `

                            <div class="slide">

                                <img
                                    src="${image}"
                                    alt="${product.name}"
                                    draggable="false"
                                >

                            </div>

                        `).join("")}

                    </div>


                    <!-- LEFT ARROW -->

                    <button
                        class="slider-arrow prev-btn"
                        onclick="previousImage()"
                        aria-label="Previous image"
                    >
                        ❮
                    </button>


                    <!-- RIGHT ARROW -->

                    <button
                        class="slider-arrow next-btn"
                        onclick="nextImage()"
                        aria-label="Next image"
                    >
                        ❯
                    </button>


                    <!-- IMAGE NUMBER -->

                    <div
                        class="image-counter"
                        id="imageCounter"
                    >
                        1 / ${product.images.length}
                    </div>

                </div>

            </div>



            <!-- PRODUCT INFORMATION -->

            <div class="product-info">

                <h1>
                    ${product.name}
                </h1>


                <div class="price">
                    ${product.price}
                </div>


                <p class="short-info">
                    ${product.shortInfo}
                </p>


                <h2 class="details-title">
                    Product Details
                </h2>


                <ul class="details-list">

                    ${product.details.map(detail => `

                        <li>
                            ✓ ${detail}
                        </li>

                    `).join("")}

                </ul>


                <h2 class="details-title">
                    Description
                </h2>


                <p class="description">
                    ${product.description}
                </p>


                <a
                    href="${product.link}"
                    target="_blank"
                    rel="nofollow sponsored"
                    class="order-btn"
                >
                    🛒 অর্ডার নাও
                </a>

            </div>

        </div>

    `;


    /* START SWIPE */

    const slider =
        document.getElementById("imageSlider");


    slider.addEventListener(
        "touchstart",
        function(event){

            startX =
                event.touches[0].clientX;

        },
        {passive:true}
    );


    slider.addEventListener(
        "touchend",
        function(event){

            endX =
                event.changedTouches[0].clientX;

            handleSwipe();

        },
        {passive:true}
    );

}



/* ==================================================
   NEXT IMAGE
================================================== */

function nextImage(){

    if(!product){
        return;
    }

    currentImage++;

    if(currentImage >= product.images.length){

        currentImage = 0;

    }

    showImage();

}



/* ==================================================
   PREVIOUS IMAGE
================================================== */

function previousImage(){

    if(!product){
        return;
    }

    currentImage--;

    if(currentImage < 0){

        currentImage =
            product.images.length - 1;

    }

    showImage();

}



/* ==================================================
   SHOW CURRENT IMAGE
================================================== */

function showImage(){

    const track =
        document.getElementById("imageTrack");

    const counter =
        document.getElementById("imageCounter");


    if(!track || !counter){
        return;
    }


    track.style.transform =
        "translateX(-" +
        (currentImage * 100) +
        "%)";


    counter.innerText =
        (currentImage + 1) +
        " / " +
        product.images.length;

}



/* ==================================================
   MOBILE SWIPE
================================================== */

function handleSwipe(){

    const difference =
        startX - endX;


    /* SWIPE LEFT */

    if(difference > 50){

        nextImage();

    }


    /* SWIPE RIGHT */

    else if(difference < -50){

        previousImage();

    }

}



/* ==================================================
   KEYBOARD CONTROL
================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowRight"){

            nextImage();

        }

        if(event.key === "ArrowLeft"){

            previousImage();

        }

    }
);

</script>
